<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도트 농사 시뮬레이터</title>
<style>
@font-face {
    font-family: 'MemomentKkukkukk';
    src: url('MemomentKkukkukk.ttf') format('truetype');
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}
body {
    background-color: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'MemomentKkukkukk', sans-serif;
    overflow: hidden;
}
#game-container {
    position: relative;
    height: 88vh;
    width: calc(88vh * (2 / 3));
    max-width: 95vw;
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
    border: 6px solid #2d1810;
    background: #83b869;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="480" height="720"></canvas>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
const canvas = document.getElementById('gameCanvas');
if (!canvas) return;
const ctx = canvas.getContext('2d');
if (!ctx) return;

ctx.imageSmoothingEnabled = false;

// --- 이미지 로딩 헬퍼 ---
function isLoaded(img) {
    return img && img.complete && img.naturalWidth !== 0;
}

function drawImg(image, x, y, w, h) {
    if (isLoaded(image)) {
        if (w !== undefined && h !== undefined) {
            ctx.drawImage(image, x, y, w, h);
        } else {
            ctx.drawImage(image, x, y);
        }
        return true;
    }
    return false;
}

const titleImage = new Image(); titleImage.src = 'title.png';
const doorImage = new Image(); doorImage.src = 'door.png';
const postImage = new Image(); postImage.src = 'post.png';
const fullPostImage = new Image(); fullPostImage.src = 'full_post.png';
const chooseMapImage = new Image(); chooseMapImage.src = 'choose_map.png';
const closeImage = new Image(); closeImage.src = 'close.png';

let hasMail = true;

const DOOR_POS = { x: 335, y: 16, w: 82, h: 88 };
const HOUSE_DOOR_POS = { x: 185, y: 625, w: 75, h: 85 };
const POST_POS = { x: 252, y: 135, w: 52, h: 55 };

const charSprites = {
    south: { img: new Image(), src: 'south_walk.png', loaded: false, cols: 7, rows: 2, walkFrames: [0, 2, 4, 6], offsets: [0, 2, 0, 2] },
    north: { img: new Image(), src: 'north_walk.png', loaded: false, cols: 7, rows: 2, walkFrames: [0, 2, 4, 6], offsets: [0, 2, 0, 2] },
    east: { img: new Image(), src: 'east_walk.png', loaded: false, cols: 4, rows: 1, walkFrames: [0, 1, 2, 3], offsets: [0, 0, 0, 0] }
};

function loadCharSprite(key) {
    const s = charSprites[key];
    s.img.onload = () => {
        s.frameW = s.img.width / s.cols;
        s.frameH = s.img.height / s.rows;
        s.loaded = true;
    };
    s.img.src = s.src;
}
loadCharSprite('south');
loadCharSprite('north');
loadCharSprite('east');

function getSpriteKey(dir) {
    return dir === 'west' ? 'east' : dir;
}

const uiImages = {
    dateTime: new Image(),
    inventory: new Image(),
    season: new Image(),
    bagGrid: new Image()
};
uiImages.dateTime.src = 'ui_datetime.png';
uiImages.inventory.src = 'ui_inventory.png';
uiImages.season.src = 'ui_season.png';
uiImages.bagGrid.src = 'ui_bag_grid.png';

const itemImages = {
    rake: new Image(),
    can: new Image(),
    potato_seed: new Image(),
    potato: new Image(),
    bag: new Image()
};
itemImages.rake.src = 'item_rake.png';
itemImages.can.src = 'item_can.png';
itemImages.potato_seed.src = 'item_potato_seed.png';
itemImages.potato.src = 'item_potato.png';
itemImages.bag.src = 'item_bag.png';

const cropImages = {
    potato: [new Image(), new Image(), new Image()]
};
cropImages.potato[0].src = 'crop_potato_stage1.png';
cropImages.potato[1].src = 'crop_potato_stage2.png';
cropImages.potato[2].src = 'crop_potato_stage3.png';

const bgImages = {
    MORNING_HOUSE: new Image(), MORNING_FARM: new Image(),
    EVENING_HOUSE: new Image(), EVENING_FARM: new Image(),
    NIGHT_HOUSE: new Image(), NIGHT_FARM: new Image(),
    DAWN_HOUSE: new Image(), DAWN_FARM: new Image()
};
bgImages.MORNING_HOUSE.src = 'house_morning.png';
bgImages.MORNING_FARM.src = 'farm_morning.png';
bgImages.EVENING_HOUSE.src = 'house_evening.png';
bgImages.EVENING_FARM.src = 'farm_evening.png';
bgImages.NIGHT_HOUSE.src = 'house_night.png';
bgImages.NIGHT_FARM.src = 'farm_night.png';
bgImages.DAWN_HOUSE.src = 'house_dawn.png';
bgImages.DAWN_FARM.src = 'farm_dawn.png';

let gameState = 'TITLE';
let fadeAlpha = 0;
let fadeState = 'NONE';
let pendingSceneChange = null;
let showSleepModal = false;
let showChooseMapModal = false;

const SEASONS = ['봄', '여름', '가을', '겨울'];
let currentSeasonIdx = 0;
let currentDay = 1;
let gameTime = 6 * 60;

let selectedHotbarSlot = 0;
let isBagOpen = false;

let selectedItemNotice = '';
let selectedItemNoticeTimer = 0;

const INTERACTION_DIST = 55;

const hotbar = [
    { type: 'tool', id: 'rake', name: '갈퀴', count: 1 },
    { type: 'tool', id: 'can', name: '물뿌리개', count: 1 },
    null,
    null
];
const bagInventory = new Array(30).fill(null);

const player = {
    x: 240,
    y: 360,
    targetX: 240,
    targetY: 360,
    speed: 3.5,
    direction: 'south',
    isSleeping: false,
    frameIndex: 0,
    frameTimer: 0,
    isMoving: false
};

const FARM_COLS = 6;
const FARM_ROWS = 10;
const farmOffsetX = 50;
const farmOffsetY = 260;
const tileW = 43.3;
const tileH = 41.5;

const farmTiles = Array.from({ length: FARM_ROWS * FARM_COLS }, () => ({
    tilled: false,
    watered: false,
    crop: null
}));

const CROP_DATA = {
    potato: { name: '감자', seasons: ['봄'], growthDays: 3, minYield: 2, maxYield: 4 }
};

const titleButtons = [
    { id: 'start', x: 130, y: 320, w: 180, h: 65 },
    { id: 'option', x: 130, y: 410, w: 180, h: 65 },
    { id: 'exit', x: 130, y: 500, w: 180, h: 65 }
];

function getDistance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

function checkCollision(x, y, scene) {
    const pRadius = 12;
    const pBox = {
        left: x - pRadius,
        right: x + pRadius,
        top: y - 6,
        bottom: y + pRadius
    };

    let obstacles = [];

    if (scene === 'FARM') {
        obstacles = [
            { x: 0, y: 0, w: 260, h: 105 },
            { x: 0, y: 105, w: 25, h: 575 },
            { x: 0, y: 680, w: 480, h: 40 },
            { x: 260, y: 0, w: 220, h: 105 },
            { x: 165, y: 105, w: 85, h: 30 }
        ];
    } else if (scene === 'HOUSE') {
        obstacles = [
            { x: 0, y: 0, w: 480, h: 260 },
            { x: 0, y: 0, w: 65, h: 720 },
            { x: 415, y: 0, w: 65, h: 720 },
            { x: 0, y: 645, w: 180, h: 75 },
            { x: 260, y: 645, w: 220, h: 75 },
            { x: 95, y: 280, w: 95, h: 130 },
            { x: 115, y: 430, w: 45, h: 60 },
            { x: 300, y: 230, w: 135, h: 210 }
        ];
    }

    for (const obs of obstacles) {
        if (pBox.right > obs.x && pBox.left < obs.x + obs.w &&
            pBox.bottom > obs.y && pBox.top < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function updatePlayerDirection(targetX, targetY) {
    const dx = targetX - player.x;
    const dy = targetY - player.y;

    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        player.direction = dx > 0 ? 'east' : 'west';
    } else {
        player.direction = dy > 0 ? 'south' : 'north';
    }
}

function getTimePeriod(timeInMinutes) {
    const hour = Math.floor(timeInMinutes / 60) % 24;
    if (hour >= 6 && hour < 18) return 'MORNING';
    if (hour >= 18 && hour < 21) return 'EVENING';
    if (hour >= 21 || hour < 4) return 'NIGHT';
    return 'DAWN';
}

function formatGameTime(timeInMinutes) {
    const totalMin = Math.floor(timeInMinutes) % (24 * 60);
    const hours = Math.floor(totalMin / 60);
    const mins = totalMin % 60;
    const period = hours >= 12 ? 'PM' : 'AM';
    const displayHour = hours % 12 === 0 ? 12 : hours % 12;
    const displayMin = String(mins).padStart(2, '0');
    return `${displayHour}:${displayMin} ${period}`;
}

let lastTime = performance.now();
function gameLoop() {
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (fadeState === 'OUT') {
        fadeAlpha += dt * 2.5;
        if (fadeAlpha >= 1) {
            fadeAlpha = 1;
            if (pendingSceneChange) {
                pendingSceneChange();
                pendingSceneChange = null;
            }
            fadeState = 'IN';
        }
    } else if (fadeState === 'IN') {
        fadeAlpha -= dt * 2.5;
        if (fadeAlpha <= 0) {
            fadeAlpha = 0;
            fadeState = 'NONE';
        }
    }

    if (selectedItemNoticeTimer > 0) {
        selectedItemNoticeTimer -= dt;
        if (selectedItemNoticeTimer <= 0) {
            selectedItemNoticeTimer = 0;
            selectedItemNotice = '';
        }
    }

    if (gameState === 'TITLE' || showSleepModal || showChooseMapModal) return;

    if (!player.isSleeping) {
        const hour = Math.floor(gameTime / 60) % 24;
        let timeSpeed = 1;

        if (hour >= 6 && hour < 18) {
            timeSpeed = 2.0;
        } else if (hour >= 18 && hour < 21) {
            timeSpeed = 1.0;
        } else if (hour >= 21 || hour < 4) {
            timeSpeed = 2.33;
        } else {
            timeSpeed = 0.67;
        }

        gameTime += dt * timeSpeed;

        if (gameTime >= 24 * 60) {
            gameTime -= 24 * 60;
        }
    }

    const dx = player.targetX - player.x;
    const dy = player.targetY - player.y;
    const dist = getDistance(player.x, player.y, player.targetX, player.targetY);

    if (dist > 1.5) {
        player.isMoving = true;
        const moveDist = Math.min(dist, player.speed);
        const nextX = player.x + (dx / dist) * moveDist;
        const nextY = player.y + (dy / dist) * moveDist;

        let canMoveX = !checkCollision(nextX, player.y, gameState);
        let canMoveY = !checkCollision(player.x, nextY, gameState);

        if (canMoveX) player.x = nextX;
        if (canMoveY) player.y = nextY;

        if (!canMoveX && !canMoveY) {
            player.targetX = player.x;
            player.targetY = player.y;
            player.isMoving = false;
        }
    } else {
        player.x = player.targetX;
        player.y = player.targetY;
        player.isMoving = false;
    }

    if (gameState === 'FARM' && player.x >= 445 && player.y >= 320 && player.y <= 480) {
        showChooseMapModal = true;
        player.targetX = player.x;
        player.targetY = player.y;
        player.isMoving = false;
    }

    if (player.isMoving) {
        player.frameTimer++;
        if (player.frameTimer % 8 === 0) {
            const activeKey = getSpriteKey(player.direction);
            const active = charSprites[activeKey];
            if (active && active.walkFrames) {
                player.frameIndex = (player.frameIndex + 1) % active.walkFrames.length;
            }
        }
    } else {
        player.frameIndex = 0;
        player.frameTimer = 0;
    }
}

function nextDay() {
    startFade(() => {
        currentDay++;
        if (currentDay > 20) {
            currentDay = 1;
            currentSeasonIdx = (currentSeasonIdx + 1) % 4;
        }
        gameTime = 6 * 60;

        farmTiles.forEach(tile => {
            if (tile.crop && tile.watered) {
                tile.crop.progressDays += 1;
            }
            tile.watered = false;
        });

        gameState = 'HOUSE';
        player.x = 240;
        player.y = 380;
        player.targetX = 240;
        player.targetY = 380;
        player.direction = 'south';
        player.isSleeping = false;
    });
}

function startFade(callback) {
    fadeState = 'OUT';
    pendingSceneChange = callback;
}

// 개선된 아이템 추가 로직 (기존 스택 우선 합산)
function addItemToInventory(item) {
    // 1. 핫바에 기존 스택이 존재하는지 확인
    for (let i = 2; i < 4; i++) {
        if (hotbar[i] && hotbar[i].id === item.id) {
            hotbar[i].count += item.count;
            return true;
        }
    }
    // 2. 가방에 기존 스택이 존재하는지 확인
    for (let i = 0; i < bagInventory.length; i++) {
        if (bagInventory[i] && bagInventory[i].id === item.id) {
            bagInventory[i].count += item.count;
            return true;
        }
    }
    // 3. 핫바의 빈 슬롯 확인
    for (let i = 2; i < 4; i++) {
        if (!hotbar[i]) {
            hotbar[i] = { ...item };
            return true;
        }
    }
    // 4. 가방의 빈 슬롯 확인
    for (let i = 0; i < bagInventory.length; i++) {
        if (!bagInventory[i]) {
            bagInventory[i] = { ...item };
            return true;
        }
    }
    return false;
}

function showItemNotice(name) {
    selectedItemNotice = name;
    selectedItemNoticeTimer = 2.5;
}

window.addEventListener('keydown', (e) => {
    if (e.key === 'b' || e.key === 'B' || e.key === 'i' || e.key === 'I') {
        if (gameState !== 'TITLE') {
            isBagOpen = !isBagOpen;
        }
    } else if (e.key === 'Escape') {
        isBagOpen = false;
        showSleepModal = false;
        showChooseMapModal = false;
    }
});

canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (fadeState !== 'NONE') return;

    if (showChooseMapModal) {
        const uiW = 360, uiH = 360;
        const uiX = (canvas.width - uiW) / 2;
        const uiY = (canvas.height - uiH) / 2;
        const closeX = uiX + 10, closeY = uiY + 10, closeSize = 36;

        if (clickX >= closeX && clickX <= closeX + closeSize && clickY >= closeY && clickY <= closeY + closeSize) {
            showChooseMapModal = false;
            player.x = 420;
            player.targetX = 420;
        }
        return;
    }

    if (showSleepModal) {
        if (clickX >= 140 && clickX <= 210 && clickY >= 370 && clickY <= 405) {
            showSleepModal = false;
            nextDay();
        } else if (clickX >= 270 && clickX <= 340 && clickY >= 370 && clickY <= 405) {
            showSleepModal = false;
        }
        return;
    }

    if (gameState === 'TITLE') {
        titleButtons.forEach(btn => {
            if (clickX >= btn.x && clickX <= btn.x + btn.w && clickY >= btn.y && clickY <= btn.y + btn.h) {
                if (btn.id === 'start') {
                    startFade(() => {
                        gameState = 'HOUSE';
                        player.x = 240;
                        player.y = 480;
                        player.targetX = 240;
                        player.targetY = 480;
                        player.direction = 'north';
                    });
                } else if (btn.id === 'option') {
                    showItemNotice('옵션 메뉴 준비 중');
                } else if (btn.id === 'exit') {
                    alert('게임을 종료합니다.');
                }
            }
        });
        return;
    }

    if (isBagOpen) {
        const bagX = 50, bagY = 160, bagW = 380, bagH = 320;
        const gridStartX = bagX + 22;
        const gridStartY = bagY + 22;
        const cellW = 56;
        const cellH = 52;

        // 가방 안의 아이템을 클릭했을 때 핫바와 교체
        if (clickX >= gridStartX && clickX <= gridStartX + 6 * cellW &&
            clickY >= gridStartY && clickY <= gridStartY + 5 * cellH) {
            const c = Math.floor((clickX - gridStartX) / cellW);
            const r = Math.floor((clickY - gridStartY) / cellH);
            const idx = r * 6 + c;

            if (idx >= 0 && idx < bagInventory.length && bagInventory[idx]) {
                const targetSlot = (selectedHotbarSlot >= 2 && selectedHotbarSlot < 4) ? selectedHotbarSlot : 2;
                const temp = hotbar[targetSlot];
                hotbar[targetSlot] = bagInventory[idx];
                bagInventory[idx] = temp;
                showItemNotice(`${hotbar[targetSlot].name} 장착됨`);
                return;
            }
        }

        if (clickX < bagX || clickX > bagX + bagW || clickY < bagY || clickY > bagY + bagH) {
            isBagOpen = false;
        }
        return;
    }

    const invX = 10, invY = 85, invW = 65;
    if (clickX >= invX && clickX <= invX + invW) {
        const startY = invY + 8;
        const slotH = 51;
        for (let i = 0; i < 5; i++) {
            const sy = startY + i * slotH;
            if (clickY >= sy && clickY <= sy + 46) {
                if (i === 4) {
                    isBagOpen = !isBagOpen;
                    return;
                }
                if (selectedHotbarSlot === i) {
                    selectedHotbarSlot = -1;
                } else {
                    selectedHotbarSlot = i;
                    if (hotbar[i]) {
                        showItemNotice(hotbar[i].name);
                    }
                }
                return;
            }
        }
    }

    if (gameState === 'FARM') {
        if (clickX >= POST_POS.x - 10 && clickX <= POST_POS.x + POST_POS.w + 10 &&
            clickY >= POST_POS.y - 10 && clickY <= POST_POS.y + POST_POS.h + 20) {

            const postFrontX = POST_POS.x + POST_POS.w / 2;
            const postFrontY = POST_POS.y + POST_POS.h + 25;

            if (getDistance(player.x, player.y, postFrontX, postFrontY) <= INTERACTION_DIST) {
                if (hasMail) {
                    const seedItem = { type: 'seed', id: 'potato_seed', cropId: 'potato', name: '감자 씨앗', count: 6 };
                    const success = addItemToInventory(seedItem);
                    if (success) {
                        hasMail = false;
                        showItemNotice('감자 씨앗 6개를 얻었습니다!');
                    } else {
                        showItemNotice('인벤토리가 가득 찼습니다.');
                    }
                } else {
                    showItemNotice('우편함이 비어있습니다.');
                }
            } else {
                updatePlayerDirection(postFrontX, postFrontY);
                player.targetX = postFrontX;
                player.targetY = postFrontY;
            }
            return;
        }

        if (clickX >= DOOR_POS.x && clickX <= DOOR_POS.x + DOOR_POS.w &&
            clickY >= DOOR_POS.y && clickY <= DOOR_POS.y + DOOR_POS.h + 30) {
            const doorFrontX = DOOR_POS.x + DOOR_POS.w / 2;
            const doorFrontY = DOOR_POS.y + DOOR_POS.h + 20;

            if (getDistance(player.x, player.y, doorFrontX, doorFrontY) <= INTERACTION_DIST) {
                startFade(() => {
                    gameState = 'HOUSE';
                    player.x = 220;
                    player.y = 610;
                    player.targetX = 220;
                    player.targetY = 610;
                    player.direction = 'north';
                });
            } else {
                updatePlayerDirection(doorFrontX, doorFrontY);
                player.targetX = doorFrontX;
                player.targetY = doorFrontY;
            }
            return;
        }
    }

    if (gameState === 'FARM' &&
        clickX >= farmOffsetX && clickX <= farmOffsetX + FARM_COLS * tileW &&
        clickY >= farmOffsetY && clickY <= farmOffsetY + FARM_ROWS * tileH) {

        const col = Math.floor((clickX - farmOffsetX) / tileW);
        const row = Math.floor((clickY - farmOffsetY) / tileH);

        if (col >= 0 && col < FARM_COLS && row >= 0 && row < FARM_ROWS) {
            const tileCenterX = farmOffsetX + col * tileW + tileW / 2;
            const tileCenterY = farmOffsetY + row * tileH + tileH / 2;

            if (getDistance(player.x, player.y, tileCenterX, tileCenterY) > INTERACTION_DIST) {
                updatePlayerDirection(tileCenterX, tileCenterY);
                player.targetX = tileCenterX;
                player.targetY = tileCenterY;
                return;
            }

            const tileIdx = row * FARM_COLS + col;
            const tile = farmTiles[tileIdx];

            updatePlayerDirection(tileCenterX, tileCenterY);

            const activeItem = selectedHotbarSlot >= 0 ? hotbar[selectedHotbarSlot] : null;

            if (activeItem && activeItem.id === 'rake') {
                tile.tilled = true;
            } else if (activeItem && activeItem.id === 'can') {
                tile.watered = true;
            } else if (activeItem && activeItem.type === 'seed') {
                if (tile.tilled && !tile.crop) {
                    tile.crop = { id: activeItem.cropId, progressDays: 0, growthDays: CROP_DATA[activeItem.cropId].growthDays };
                    activeItem.count--;
                    if (activeItem.count <= 0) hotbar[selectedHotbarSlot] = null;
                }
            } else if (selectedHotbarSlot === -1) {
                // 수확 시 인벤토리가 가득 찼을 때 작물이 사라지지 않도록 보호
                if (tile.crop && tile.crop.progressDays >= tile.crop.growthDays) {
                    const cropInfo = CROP_DATA[tile.crop.id];
                    const yieldCount = Math.floor(Math.random() * (cropInfo.maxYield - cropInfo.minYield + 1)) + cropInfo.minYield;
                    const success = addItemToInventory({ type: 'crop', id: tile.crop.id, name: cropInfo.name, count: yieldCount });
                    if (success) {
                        tile.crop = null;
                        showItemNotice(`${cropInfo.name} ${yieldCount}개를 수확했습니다!`);
                    } else {
                        showItemNotice('인벤토리가 가득 차 수확할 수 없습니다.');
                    }
                }
            }
            return;
        }
    }

    if (gameState === 'HOUSE') {
        if (clickX >= 300 && clickX <= 435 && clickY >= 230 && clickY <= 440) {
            const bedInteractX = 275;
            const bedInteractY = 335;
            if (getDistance(player.x, player.y, bedInteractX, bedInteractY) <= INTERACTION_DIST) {
                showSleepModal = true;
            } else {
                updatePlayerDirection(bedInteractX, bedInteractY);
                player.targetX = bedInteractX;
                player.targetY = bedInteractY;
            }
            return;
        }

        if (clickX >= HOUSE_DOOR_POS.x && clickX <= HOUSE_DOOR_POS.x + HOUSE_DOOR_POS.w &&
            clickY >= HOUSE_DOOR_POS.y && clickY <= HOUSE_DOOR_POS.y + HOUSE_DOOR_POS.h) {
            const doorFrontX = HOUSE_DOOR_POS.x + HOUSE_DOOR_POS.w / 2;
            const doorFrontY = HOUSE_DOOR_POS.y;

            if (getDistance(player.x, player.y, doorFrontX, doorFrontY) <= INTERACTION_DIST) {
                startFade(() => {
                    gameState = 'FARM';
                    player.x = 375;
                    player.y = 135;
                    player.targetX = 375;
                    player.targetY = 135;
                    player.direction = 'south';
                });
            } else {
                updatePlayerDirection(doorFrontX, doorFrontY);
                player.targetX = doorFrontX;
                player.targetY = doorFrontY;
            }
            return;
        }
    }

    updatePlayerDirection(clickX, clickY);
    player.targetX = clickX;
    player.targetY = clickY;
});

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'TITLE') renderTitleScreen();
    else if (gameState === 'HOUSE') { renderHouseMap(); renderPlayer(); renderUI(); }
    else if (gameState === 'FARM') { renderFarmMap(); renderPlayer(); renderUI(); }

    if (showChooseMapModal) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const uiW = 360, uiH = 360;
        const uiX = (canvas.width - uiW) / 2;
        const uiY = (canvas.height - uiH) / 2;

        drawImg(chooseMapImage, uiX, uiY, uiW, uiH);

        const closeX = uiX + 10, closeY = uiY + 10, closeSize = 36;
        drawImg(closeImage, closeX, closeY, closeSize, closeSize);
    }

    if (showSleepModal) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2d1810';
        ctx.fillRect(110, 300, 260, 130);
        ctx.strokeStyle = '#c78d53';
        ctx.lineWidth = 3;
        ctx.strokeRect(110, 300, 260, 130);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px MemomentKkukkukk';
        ctx.textAlign = 'center';
        ctx.fillText('주무시겠습니까?', 240, 340);

        ctx.fillStyle = '#4ae052';
        ctx.fillRect(140, 370, 70, 35);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(140, 370, 70, 35);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 14px MemomentKkukkukk';
        ctx.fillText('네', 175, 393);

        ctx.fillStyle = '#e04a4a';
        ctx.fillRect(270, 370, 70, 35);
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(270, 370, 70, 35);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('아니오', 305, 393);
    }

    if (fadeAlpha > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function renderTitleScreen() {
    if (!drawImg(titleImage, 0, 0, canvas.width, canvas.height)) {
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px MemomentKkukkukk';
        ctx.textAlign = 'center';
        ctx.fillText('타이틀 화면 로딩 중...', canvas.width / 2, canvas.height / 2);
    }
}

function applyTimeOverlay() {
    const period = getTimePeriod(gameTime);
    if (period === 'EVENING') {
        ctx.fillStyle = 'rgba(230, 110, 30, 0.25)';
    } else if (period === 'NIGHT') {
        ctx.fillStyle = 'rgba(15, 20, 60, 0.55)';
    } else if (period === 'DAWN') {
        ctx.fillStyle = 'rgba(60, 30, 80, 0.45)';
    }
    if (period !== 'MORNING') {
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function drawBackgroundImage(imgKey) {
    if (!drawImg(bgImages[imgKey], 0, 0, canvas.width, canvas.height)) {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function renderHouseMap() {
    const period = getTimePeriod(gameTime);
    drawBackgroundImage(`${period}_HOUSE`);
    drawImg(doorImage, HOUSE_DOOR_POS.x, HOUSE_DOOR_POS.y, HOUSE_DOOR_POS.w, HOUSE_DOOR_POS.h);
    applyTimeOverlay();
}

function renderFarmMap() {
    const period = getTimePeriod(gameTime);
    drawBackgroundImage(`${period}_FARM`);
    drawImg(doorImage, DOOR_POS.x, DOOR_POS.y, DOOR_POS.w, DOOR_POS.h);

    const currentPostImg = hasMail ? fullPostImage : postImage;
    drawImg(currentPostImg, POST_POS.x, POST_POS.y, POST_POS.w, POST_POS.h);

    for (let r = 0; r < FARM_ROWS; r++) {
        for (let c = 0; c < FARM_COLS; c++) {
            const idx = r * FARM_COLS + c;
            const tile = farmTiles[idx];
            const tx = farmOffsetX + c * tileW;
            const ty = farmOffsetY + r * tileH;

            if (tile.tilled) {
                ctx.fillStyle = 'rgba(80, 45, 22, 0.2)';
                ctx.fillRect(tx + 1, ty + 1, tileW - 2, tileH - 2);
            }

            if (tile.watered) {
                ctx.fillStyle = 'rgba(20, 10, 5, 0.35)';
                ctx.fillRect(tx + 1, ty + 1, tileW - 2, tileH - 2);
            }

            if (tile.crop) {
                let stageIdx = 0;
                if (tile.crop.progressDays >= tile.crop.growthDays) stageIdx = 2;
                else if (tile.crop.progressDays > 0) stageIdx = 1;

                const cropImg = cropImages[tile.crop.id][stageIdx];
                drawImg(cropImg, tx + (tileW - 32) / 2, ty + (tileH - 32) / 2, 32, 32);
            }
        }
    }

    applyTimeOverlay();
}

function renderPlayer() {
    const activeKey = getSpriteKey(player.direction);
    const active = charSprites[activeKey];

    if (active && active.loaded) {
        const RENDER_HEIGHT = 110;
        const renderWidth = (active.frameW / active.frameH) * RENDER_HEIGHT;

        const currentFrame = active.walkFrames[player.frameIndex] || 0;
        const sx = (currentFrame % active.cols) * active.frameW;
        const sy = Math.floor(currentFrame / active.cols) * active.frameH;
        const offsetY = player.isMoving ? active.offsets[player.frameIndex] : 0;

        const drawX = player.x - renderWidth / 2;
        const drawY = player.y - RENDER_HEIGHT + 16 + offsetY;

        ctx.save();
        if (player.direction === 'west') {
            ctx.translate(drawX + renderWidth, drawY);
            ctx.scale(-1, 1);
            ctx.drawImage(active.img, sx, sy, active.frameW, active.frameH, 0, 0, renderWidth, RENDER_HEIGHT);
        } else {
            ctx.drawImage(active.img, sx, sy, active.frameW, active.frameH, drawX, drawY, renderWidth, RENDER_HEIGHT);
        }
        ctx.restore();
    } else {
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(player.x - 12, player.y - 20, 24, 40);
    }

    if (selectedItemNoticeTimer > 0 && selectedItemNotice) {
        let alpha = 1.0;
        if (selectedItemNoticeTimer < 0.5) {
            alpha = selectedItemNoticeTimer / 0.5;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.font = 'bold 12px MemomentKkukkukk';
        ctx.textAlign = 'center';

        const textMetrics = ctx.measureText(selectedItemNotice);
        const bgWidth = textMetrics.width + 12;
        const bgHeight = 18;
        const textX = player.x;
        const textY = player.y - 100;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(textX - bgWidth / 2, textY - 13, bgWidth, bgHeight);
        ctx.strokeStyle = '#c78d53';
        ctx.lineWidth = 1;
        ctx.strokeRect(textX - bgWidth / 2, textY - 13, bgWidth, bgHeight);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(selectedItemNotice, textX, textY);
        ctx.restore();
    }
}

function renderItemIcon(item, x, y, size) {
    if (!item) return;
    drawImg(itemImages[item.id], x, y, size, size);
}

function renderUI() {
    const seasonX = 10, seasonY = 10, seasonSize = 65;
    drawImg(uiImages.season, seasonX, seasonY, seasonSize, seasonSize);

    ctx.fillStyle = '#5c311e';
    ctx.font = 'bold 18px MemomentKkukkukk';
    ctx.textAlign = 'center';
    ctx.fillText(SEASONS[currentSeasonIdx], seasonX + seasonSize / 2, seasonY + seasonSize / 2 + 6);

    const dtX = 80, dtY = 10, dtW = 140, dtH = 65;
    drawImg(uiImages.dateTime, dtX, dtY, dtW, dtH);

    ctx.fillStyle = '#a83232';
    ctx.font = 'bold 12px MemomentKkukkukk';
    ctx.textAlign = 'center';
    ctx.fillText(`${currentDay}일`, dtX + 70, dtY + 22);

    ctx.fillStyle = '#3d2314';
    ctx.font = 'bold 11px MemomentKkukkukk';
    ctx.textAlign = 'center';
    ctx.fillText(formatGameTime(gameTime), dtX + 70, dtY + 48);

    const invX = 10, invY = 85, invW = 65, invH = 260;
    drawImg(uiImages.inventory, invX, invY, invW, invH);

    const startY = invY + 8;
    const slotH = 51;
    const iconSize = 32;

    for (let i = 0; i < 5; i++) {
        const slotY = startY + i * slotH;

        if (selectedHotbarSlot === i && i !== 4) {
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 2;
            ctx.strokeRect(invX + 11, slotY + 2, invW - 22, 42);
        }

        if (i < 4) {
            const item = hotbar[i];
            if (item) {
                const iconX = invX + (invW - iconSize) / 2;
                const iconY = slotY + 7;
                renderItemIcon(item, iconX, iconY, iconSize);

                if (item.count > 1) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px MemomentKkukkukk';
                    ctx.textAlign = 'right';
                    ctx.fillText(item.count, invX + invW - 14, slotY + 41);
                }
            }
        } else if (i === 4) {
            const iconX = invX + (invW - iconSize) / 2;
            const iconY = slotY + 7;
            drawImg(itemImages.bag, iconX, iconY, iconSize, iconSize);
        }
    }

    if (isBagOpen) {
        const bagX = 50, bagY = 160, bagW = 380, bagH = 320;

        if (!drawImg(uiImages.bagGrid, bagX, bagY, bagW, bagH)) {
            ctx.fillStyle = 'rgba(20, 12, 8, 0.95)';
            ctx.fillRect(bagX, bagY, bagW, bagH);
        }

        const gridStartX = bagX + 22;
        const gridStartY = bagY + 22;
        const cellW = 56;
        const cellH = 52;

        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 6; c++) {
                const idx = r * 6 + c;
                const item = bagInventory[idx];
                if (item) {
                    const itemX = gridStartX + c * cellW + 10;
                    const itemY = gridStartY + r * cellH + 8;
                    renderItemIcon(item, itemX, itemY, 32);

                    if (item.count > 1) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 11px MemomentKkukkukk';
                        ctx.textAlign = 'right';
                        ctx.fillText(item.count, itemX + 34, itemY + 36);
                    }
                }
            }
        }
    }
}

gameLoop();
});
</script>
</body>
</html>
